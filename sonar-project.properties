# SonarQube scanner configuration para análise local opcional.

# Identidade do projeto
sonar.projectKey=modular-erp-poc-backend
sonar.projectName=Modular ERP POC Backend
sonar.projectVersion=0.0.1-SNAPSHOT

# Linguagem e binários
sonar.language=java
sonar.java.source=21
sonar.java.target=21
sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar

# Cobertura (JaCoCo XML gerado por mvn verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusões: arquivos analisados mas que não fazem sentido pra coverage/cpd
sonar.exclusions=**/package-info.java,**/dto/**
sonar.coverage.exclusions=**/*Application.java,**/package-info.java,**/dto/**,**/config/**,**/*Id.java,**/*Status.java
sonar.cpd.exclusions=**/internal/persistence/**,**/dto/**

# Server URL e token vêm de env vars no CI (SONAR_HOST_URL, SONAR_TOKEN).
# Localmente: exportar as duas variáveis no shell antes de rodar `mvn sonar:sonar`.
